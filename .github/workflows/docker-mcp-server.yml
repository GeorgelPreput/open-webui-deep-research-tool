name: Publish MCP server image

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to build from. Defaults to the calling workflow's commit."
        required: false
        type: string
      version:
        description: "Version tag override. Defaults to the value read from pyproject.toml at the build ref."
        required: false
        type: string
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: docker-mcp-server-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VALUE="${{ inputs.version }}"
          else
            VALUE=$(awk -F\" '/^version = / {print $2; exit}' pyproject.toml)
          fi
          if [ -z "$VALUE" ]; then
            echo "::error::Could not resolve version from inputs or pyproject.toml" >&2
            exit 1
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: georgelpreput/owui-deep-research
          flavor: |
            latest=false
            prefix=mcp-,onlatest=true
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Deep Research MCP server
            org.opencontainers.image.description=Streamable-HTTP MCP server for the Deep Research engine
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.licenses=see-license-file

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deep_research/entrypoints/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-mcp-server
          cache-to: type=gha,scope=docker-mcp-server,mode=max
