name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  opengrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # OpenGrep is not on PyPI; the official install script drops a
      # versioned binary under $HOME/.opengrep/cli/<version>/ and a
      # `latest` symlink. We append the latest dir to $GITHUB_PATH so
      # subsequent steps can invoke `opengrep` by name.
      - name: Install OpenGrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Verify OpenGrep
        run: opengrep --version

      # `--error` makes the action exit non-zero on findings; `--config=auto`
      # resolves rules from registry metadata, matching what we run locally.
      - name: Scan
        run: opengrep scan --config=auto --error deep_research/
