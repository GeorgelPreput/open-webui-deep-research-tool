# Local manual-test stack for the Deep Research engine.
#
#   1. cp .env.example .env
#   2. docker compose up --build
#   3. Open http://localhost:3000  (Open WebUI), create the first admin account.
#   4. Generate an API key (OWUI > Settings > Account), put it in .env as
#      DR_OWUI_API_KEY, then `docker compose up -d` to restart the callers.
#
# Full browser wiring steps (models, web search, connecting each entrypoint) are
# in deploy/README.md.
#
# Services:
#   open-webui    http://localhost:3000   the UI you test in
#   pipelines     http://localhost:9099    deep_research pipeline (OpenAI-compatible)
#   openapi-tool  http://localhost:8000    OpenAPI tool server (/docs, /research, /health)
#   mcp           http://localhost:9000    MCP server (streamable-http at /mcp)

name: deep-research

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dr-open-webui
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-please-change-me}
      # Uncomment to use an Ollama server running on the host machine:
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui-data:/app/backend/data
    restart: unless-stopped

  pipelines:
    build:
      context: .
      dockerfile: deploy/Dockerfile.pipelines
    image: deep-research/pipelines:local
    container_name: dr-pipelines
    ports:
      - "9099:9099"
    environment:
      # Must match the API key OWUI uses for its Pipelines connection.
      PIPELINES_API_KEY: ${PIPELINES_API_KEY:-0p3n-w3bu!}
      DR_OWUI_BASE_URL: http://open-webui:8080
      DR_OWUI_API_KEY: ${DR_OWUI_API_KEY:-}
      DR_DATA_DIR: /app/pipelines/data/deep-research
    volumes:
      - pipelines-data:/app/pipelines/data
    depends_on:
      - open-webui
    restart: unless-stopped

  openapi-tool:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: deep-research/server:local
    container_name: dr-openapi-tool
    command:
      - uvicorn
      - deep_research.entrypoints.openapi_tool.server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment:
      DR_OWUI_BASE_URL: http://open-webui:8080
      DR_OWUI_API_KEY: ${DR_OWUI_API_KEY:-}
      DR_DATA_DIR: /data/deep_research
      # Override model IDs to match OWUI > Settings > Models if the defaults
      # (gemma3:12b / gemma3:27b / nomic-embed-text) are not registered:
      # DR_MODELS_RESEARCH_MODEL: gemma3:12b
      # DR_MODELS_SYNTHESIS_MODEL: gemma3:27b
      # DR_MODELS_EMBEDDING_MODEL: nomic-embed-text
    volumes:
      - openapi-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - open-webui
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: deep-research/server:local
    container_name: dr-mcp
    command:
      - python
      - -m
      - deep_research.entrypoints.mcp.server
    ports:
      - "9000:9000"
    environment:
      DR_OWUI_BASE_URL: http://open-webui:8080
      DR_OWUI_API_KEY: ${DR_OWUI_API_KEY:-}
      DR_DATA_DIR: /data/deep_research
      # (same DR_MODELS_* overrides as openapi-tool apply here)
    volumes:
      - mcp-data:/data
    depends_on:
      - open-webui
    restart: unless-stopped

volumes:
  openwebui-data:
  pipelines-data:
  openapi-data:
  mcp-data:
