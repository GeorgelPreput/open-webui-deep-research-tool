[project]
name = "deep-research"
version = "0.2.0"
description = "Multi-cycle deep research engine — single core, four runtimes (OWUI Function, Pipeline, OpenAPI Tool, MCP)"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "numpy>=1.26",
    "tiktoken>=0.5",
    "beautifulsoup4>=4.12",
    "pypdf>=3.17",
    "pdfplumber>=0.10",
    "fake-useragent>=1.5",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]
mcp = [
    "fastmcp>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.22",
    "hypothesis>=6.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_research/"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "pipe.py",
  "deep_research_pipeline.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long
]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
